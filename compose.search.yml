name: pubburi-search

services:
  search:
    build:
      context: ./search
    image: pubburi-search:3.9.0-nori-v1
    environment:
      discovery.type: single-node
      cluster.name: pubburi-local-search
      node.name: pubburi-search
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "127.0.0.1:${PUBBURI_SEARCH_PORT:-9200}:9200"
    mem_limit: 1536m
    cpus: 1.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - pubburi-search-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pubburi-search-data:
