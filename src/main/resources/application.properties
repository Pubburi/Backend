spring.application.name=pubburi-server
server.address=127.0.0.1
server.port=${PUBBURI_JPA_PORT:0}
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
pubburi.recommendation.base-url=${PUBBURI_RECOMMENDATION_BASE_URL:http://127.0.0.1:8000}
pubburi.search.enabled=${PUBBURI_SEARCH_ENABLED:false}
pubburi.search.endpoint=${PUBBURI_SEARCH_ENDPOINT:http://127.0.0.1:9200}
pubburi.search.index=${PUBBURI_SEARCH_INDEX:pubburi-products-v1-live}
pubburi.recommendation.content-catalog-path=${PUBBURI_CONTENT_CATALOG_PATH:}
pubburi.recommendation.content-catalog-sha256=${PUBBURI_CONTENT_CATALOG_SHA256:}
spring.jpa.properties.hibernate.default_schema=pubburi
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.flyway.enabled=false
springdoc.swagger-ui.path=/docs

pubburi.recommendation.content-family-browse-demo-enabled=${PUBBURI_CONTENT_FAMILY_BROWSE_DEMO_ENABLED:false}
