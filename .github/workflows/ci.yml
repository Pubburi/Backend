name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pubburi_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_test_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci_root_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Disposable CI database settings, never production credentials.
      PUBBURI_DB_NAME: pubburi_ci
      PUBBURI_DB_USER: ci_user
      PUBBURI_DB_PASSWORD: ci_test_only
      PUBBURI_DB_ROOT_PASSWORD: ci_root_only
      PUBBURI_DB_URL: jdbc:mysql://127.0.0.1:3306/pubburi_ci
      PUBBURI_SERVER_PORT: '9987'
      # This job intentionally starts no recommendation server; the web API must still work.
      PUBBURI_RECOMMENDATION_BASE_URL: http://127.0.0.1:8000
      PUBBURI_SMOKE_EXPECT_RECOMMENDATION_SOURCE: FALLBACK
      PUBBURI_SMOKE_RUN_TOKEN: pubburi-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check repository contents
        run: python3 scripts/check_repository.py
      - name: Verify local ownership and lifecycle tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Initialize disposable database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD="$PUBBURI_DB_ROOT_PASSWORD" \
          "$MYSQL_CONTAINER_ID" mysql -uroot "$PUBBURI_DB_NAME" \
          < data.sql > /dev/null
          docker exec -e MYSQL_PWD="$PUBBURI_DB_ROOT_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot "$PUBBURI_DB_NAME" --execute \
            "CREATE TABLE pubburi_ci_smoke_guard (token VARCHAR(80) PRIMARY KEY); INSERT INTO pubburi_ci_smoke_guard VALUES ('$PUBBURI_SMOKE_RUN_TOKEN');"
      - name: Validate local database configuration
        run: docker compose config --quiet
      - name: Test and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify packaged HTTP API and order rollback
        env:
          PUBBURI_SMOKE_MUTATING: '1'
          PUBBURI_SMOKE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: ./scripts/smoke.sh
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/*.xml
            target/api-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
