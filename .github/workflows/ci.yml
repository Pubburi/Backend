name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgresql:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci_pg_admin
          POSTGRES_PASSWORD: ci_pg_admin_only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --label=pubburi.validation=postgresql-schema-ci
          --health-cmd="pg_isready -h127.0.0.1 -Uci_pg_admin -dpostgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pubburi_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_test_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci_root_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Disposable CI database settings, never production credentials.
      PUBBURI_DB_NAME: pubburi_ci
      PUBBURI_DB_USER: ci_user
      PUBBURI_DB_PASSWORD: ci_test_only
      PUBBURI_DB_ROOT_PASSWORD: ci_root_only
      PUBBURI_DB_URL: jdbc:mysql://127.0.0.1:3306/pubburi_ci
      PUBBURI_SERVER_PORT: '9987'
      # This job intentionally starts no recommendation server; the web API must still work.
      PUBBURI_RECOMMENDATION_BASE_URL: http://127.0.0.1:8000
      PUBBURI_SMOKE_EXPECT_RECOMMENDATION_SOURCE: FALLBACK
      PUBBURI_SMOKE_RUN_TOKEN: pubburi-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PUBBURI_RELAY_DB_CA: .pubburi/mysql-ca.pem
      # PostgreSQL is an isolated migration target; the current API baseline remains separately verified.
      PUBBURI_PG_URL: jdbc:postgresql://127.0.0.1:5432/pubburi_pg_fresh_ci
      PUBBURI_PG_DB_NAME: pubburi_pg_fresh_ci
      PUBBURI_PG_USER: ci_pg_migrator
      PUBBURI_PG_PASSWORD: ci_pg_fixture_only
      PUBBURI_PG_RUN_TOKEN: pubburi-pg-${{ github.run_id }}-${{ github.run_attempt }}
      PUBBURI_PG_RECOVERY_DB_NAME: pubburi_pg_recovery_ci
      PUBBURI_PG_RECOVERY_RUN_TOKEN: pubburi-pg-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      PUBBURI_PG_BLOCKED_DB_NAME: pubburi_pg_blocked_ci
      PUBBURI_PG_BLOCKED_RUN_TOKEN: pubburi-pg-blocked-${{ github.run_id }}-${{ github.run_attempt }}
      PUBBURI_PG_CA: ${{ github.workspace }}/.pubburi/postgres-ci-tls/ca.pem
      PUBBURI_PG_VALIDATION_LABEL: postgresql-schema-ci
      PUBBURI_PG_MUTATING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check repository contents
        run: python3 scripts/check_repository.py
      - name: Install isolated relay validation dependencies
        run: |
          python3 -m venv .venv-relay
          .venv-relay/bin/python -m pip install --require-hashes -r tools/search-relay/requirements.lock
      - name: Verify local ownership and lifecycle tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare isolated PostgreSQL TLS and migration fixtures
        env:
          PUBBURI_PG_CONTAINER_ID: ${{ job.services.postgresql.id }}
          PUBBURI_PG_ADMIN_USER: ci_pg_admin
          PUBBURI_PG_ADMIN_PASSWORD: ci_pg_admin_only
        run: python3 scripts/prepare_postgresql_ci.py
      - name: Verify PostgreSQL Flyway schema and identity preservation
        env:
          PUBBURI_PG_CONTAINER_ID: ${{ job.services.postgresql.id }}
          PUBBURI_PG_INTEGRATION: '1'
          # Used only by the owned test's fixed permission-failure DDL; installer remains non-superuser.
          PUBBURI_PG_ADMIN_USER: ci_pg_admin
          PUBBURI_PG_ADMIN_PASSWORD: ci_pg_admin_only
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f tools/postgresql-migration/pom.xml verify
          mkdir -p target
          python3 scripts/postgresql_schema.py validate > target/postgresql-schema-report.json
      - name: Verify isolated read-only source snapshot and failure recovery
        env:
          PUBBURI_SOURCE_CI_RUN: source-snapshot-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/source_snapshot_ci.py
      - name: Initialize disposable database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD="$PUBBURI_DB_ROOT_PASSWORD" \
          "$MYSQL_CONTAINER_ID" mysql -uroot "$PUBBURI_DB_NAME" \
          < data.sql > /dev/null
          docker exec -e MYSQL_PWD="$PUBBURI_DB_ROOT_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot "$PUBBURI_DB_NAME" --execute \
            "CREATE TABLE pubburi_ci_smoke_guard (token VARCHAR(80) PRIMARY KEY); INSERT INTO pubburi_ci_smoke_guard VALUES ('$PUBBURI_SMOKE_RUN_TOKEN');"
          docker exec -e MYSQL_PWD="$PUBBURI_DB_ROOT_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot --execute \
            "CREATE DATABASE pubburi_relay_ci; GRANT ALL ON pubburi_relay_ci.* TO 'ci_user'@'%'; CREATE TABLE pubburi_relay_ci.pubburi_ci_smoke_guard (token VARCHAR(80) PRIMARY KEY); INSERT INTO pubburi_relay_ci.pubburi_ci_smoke_guard VALUES ('${PUBBURI_SMOKE_RUN_TOKEN}-relay');"
          mkdir -p .pubburi
          docker exec "$MYSQL_CONTAINER_ID" cat /var/lib/mysql/ca.pem > .pubburi/mysql-ca.pem
      - name: Validate local database configuration
        run: docker compose config --quiet
      - name: Test and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify packaged HTTP API and order rollback
        env:
          PUBBURI_SMOKE_MUTATING: '1'
          PUBBURI_SMOKE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: ./scripts/smoke.sh
      - name: Build pinned local search image
        run: |
          docker compose -f compose.search.yml config --quiet
          docker build -t pubburi-search:3.9.0-nori-v1 search
      - name: Verify disposable search replay and restart
        env:
          PUBBURI_SEARCH_VALIDATION_RUN: search-ci-${{ github.run_id }}-${{ github.run_attempt }}
          PUBBURI_SEARCH_OUTBOX_INPUT: .pubburi/search-outbox-smoke-events.json
          PUBBURI_RELAY_SMOKE_DB_NAME: pubburi_relay_ci
          PUBBURI_SMOKE_MUTATING: '1'
          PUBBURI_SMOKE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: .venv-relay/bin/python scripts/smoke_search.py
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/*.xml
            target/api-smoke-report.json
            target/search-smoke-report.json
            target/postgresql-schema-report.json
            target/source-snapshot-report.json
            tools/postgresql-migration/target/surefire-reports/TEST-com.pubburi.migration.PostgresSchemaToolTests.xml
            tools/postgresql-migration/target/surefire-reports/TEST-com.pubburi.migration.PostgresSchemaIntegrationTests.xml
            tools/postgresql-migration/target/surefire-reports/TEST-com.pubburi.migration.IdentityReservationsTests.xml
          if-no-files-found: ignore
          retention-days: 7
